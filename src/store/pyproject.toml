[project]
name = "store"
version = "0.1.0"
description = "NAFA data collection and storage layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "APScheduler==3.11.3",
    "PyYAML==6.0.3",
    "lxml==6.0.2",
    "beautifulsoup4==4.14.3",
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
    "pymorphy3==2.0.6",
    "pymorphy3-dicts-ru==2.4.417150.4580142",
    "PyMuPDF==2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
preparation = ["matplotlib==3.11.2", "tabulate==0.10.0"]

[tool.uv]
package = false          # an application, not an installable library
