settings:
  database_path: data/nafa.sqlite3
  timeout_seconds: 20
  retries: 4

sources:
  - id: SRC-01
    name: Bank of Russia press releases
    owner: Bank of Russia
    type: rss
    url: https://www.cbr.ru/rss/RssPress
    enabled: true
    update_frequency: 15m
    tier_weight: 1.0
    legal: "Verify robots.txt and terms before deployment; store title/snippet/source link by default."
  - id: SRC-03
    name: Interfax RSS
    owner: Interfax
    type: rss
    url: https://www.interfax.ru/rss.asp
    enabled: true
    update_frequency: 15m
    tier_weight: 0.85
    legal: "Verify current feed URL, robots.txt, terms and content retention before deployment."
  - id: SRC-04
    name: RBC full RSS
    owner: RBC
    type: rss
    url: https://rssexport.rbc.ru/rbcnews/news/30/full.rss
    enabled: true
    update_frequency: 15m
    tier_weight: 0.85
    legal: "Verify current feed URL, robots.txt, terms and content retention before deployment."
  - id: SRC-02
    name: CBR daily exchange rates
    owner: Bank of Russia
    type: xml
    url: https://www.cbr.ru/scripts/XML_daily.asp
    enabled: true
    update_frequency: 1d
    tier_weight: 1.0
    legal: "Official XML; verify terms and data policy."
    xml:
      row_xpath: /ValCurs/Valute
      fields:
        date: ../@Date
        series_id: CharCode/text()
        value: Value/text()
        nominal: Nominal/text()
      series_map:
        USD: M-03
        CNY: M-04
        EUR: M-05
      decimal_separator: ","
      unit: RUB per unit
  - id: SRC-16
    name: CBR key rate
    owner: Bank of Russia
    type: html
    url: https://www.cbr.ru/hd_base/KeyRate/
    enabled: false
    update_frequency: 1d
    tier_weight: 1.0
    selectors:
      title: "h1"
      table: "table"
    legal: "Disabled until HTML selectors and current terms are verified."
  - id: SRC-CLIENTS
    name: Participant client CSV
    type: client_csv
    path: data/input/clients/df_Uid_data_hack.csv
    enabled: false
    update_frequency: manual
    tier_weight: 1.0
    legal: "Local case data; restricted; do not commit."
  - id: SRC-CLIENT-LINKS
    name: Client-person links CSV
    type: client_csv
    path: data/input/clients/client_person_links.csv
    enabled: false
    update_frequency: manual
    tier_weight: 1.0
    legal: "Local case data; restricted; do not commit."
  - id: SRC-PAYMENTS
    name: Payments CSV
    type: payment_csv
    path: data/input/payments/payments.csv
    enabled: false
    update_frequency: manual
    tier_weight: 1.0
    legal: "Local case data; restricted; do not commit."
  - id: SRC-ALFA-DOC-01
    name: Alfa slide screenshots
    type: image
    path: data/input/alfa/DOC-01
    enabled: false
    doc_id: DOC-01
    tier_weight: 1.0
    legal: "Local case material; verify redistribution permissions."
  - id: SRC-ALFA-DOC-02
    name: Alfa analytical PDF DOC-02
    type: pdf
    path: data/input/alfa/DOC-02.pdf
    enabled: false
    doc_id: DOC-02
    tier_weight: 1.0
    legal: "Local case material; verify redistribution permissions."
