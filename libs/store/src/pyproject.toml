[project]
name = "nafa-backend-parsing"
version = "0.2.0"
description = "Config-driven NAFA data ingestion, normalization and SQLite storage"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "pandas>=2.2,<4",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "PyMuPDF>=1.24,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "pymorphy3>=2,<3",
  "nltk>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "sumy>=0.11,<1",
  "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
nafa-ingest = "nafa_ingest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
