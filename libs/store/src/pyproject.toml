[project]
name = "nafa-ingest"
version = "0.1.0"
description = "Configurable data collection, normalization, and SQLite storage for NAFA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pandas>=2.2,<4",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "lxml>=5.0,<7",
  "PyYAML>=6.0,<7",
  "python-dateutil>=2.9,<3",
  "PyMuPDF>=1.24,<2",
]

[project.scripts]
nafa-ingest = "nafa_ingest.cli:main"

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nafa_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
